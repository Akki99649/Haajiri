<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student - Haajiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="s-top">
  <div class="in">
    <div class="brand"><b>Haajiri</b><span>ಹಾಜರಿ</span></div>
    <nav id="nav" aria-label="Main">
      <button data-v="home" class="on">Home</button>
      <button data-v="timetable">Timetable</button>
      <button data-v="face">Face setup</button>
    </nav>
    <div id="bell"></div>
    <button class="btn sm" onclick="doLogout()">Sign out</button>
  </div>
</header>
<main class="s-main">
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-timetable"></section>
  <section class="view" id="v-face"></section>
</main>
<script>window.ME = {{ me|tojson }};</script>
<script src="/static/js/common.js"></script>
<script src="/static/js/student.js"></script>
</body>
</html>
