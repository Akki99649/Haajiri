<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher - Haajiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b>Haajiri</b><span>ಹಾಜರಿ</span></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="spacer"></div>
    <div class="me-box"><b>{{ me.name }}</b>Teacher<br><button class="btn sm" style="margin-top:10px" onclick="doLogout()">Sign out</button></div>
  </aside>
  <main class="main">
    <div class="topbar"><div><h1 id="page-title">Today</h1><p class="muted" id="page-sub"></p></div><div id="bell"></div></div>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-live"></section>
    <section class="view" id="v-timetable"></section>
    <section class="view" id="v-students"></section>
    <section class="view" id="v-reports"></section>
    <section class="view" id="v-subjects"></section>
    <section class="view" id="v-settings"></section>
  </main>
</div>
<script>window.ME = {{ me|tojson }};</script>
<script src="/static/js/common.js"></script>
<script src="/static/js/teacher.js"></script>
</body>
</html>
